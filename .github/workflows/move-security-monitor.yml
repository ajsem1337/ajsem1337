name: Move security monitor secret

on:
  workflow_dispatch:

permissions: {}

jobs:
  move-secret:
    if: github.repository == 'ajsem1337/ajsem1337' && github.actor == 'ajsem1337'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy existing monitor credential to its new repository
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PROJECT_TOKEN }}
          GH_HOST: github.com
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          printf '%s' "$GH_TOKEN" | gh secret set SECURITY_PROJECT_TOKEN --repo ajsem1337/github-automation
