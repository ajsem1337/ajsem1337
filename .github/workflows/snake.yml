name: Update contribution snake

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23b34b79&color_dots=%23ebedf0,%23f5dce8,%23eeb4ce,%23d97ea6,%23b34b79
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23f09bc0&color_dots=%23161b22,%2339283c,%236b3c59,%23aa6286,%23f09bc0

      - name: Store generated animations
        uses: actions/upload-artifact@v4
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download animations
        uses: actions/download-artifact@v4
        with:
          name: contribution-snake
          path: assets

      - name: Publish animations when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution animations are already up to date.'
            exit 0
          fi
          git commit -m 'Update contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
